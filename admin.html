/* ===== نافذة الطلب + أقسام الاشتراكات والمتاجر ===== */
.ow-modal .modal-card{max-width:560px}
.ow{padding:26px 22px 22px}.ow h3{font-size:21px;margin:0 0 4px}.ow .ow-sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.ow-bar{height:5px;border-radius:9px;background:rgba(128,128,128,.2);overflow:hidden;margin:0 0 18px}.ow-bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#8d2c45,#581825);transition:width .45s var(--spring)}
.ow-q{font-weight:800;font-size:16.5px;margin:0 0 12px;line-height:1.6}.ow-q small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.ow-opts{display:flex;flex-wrap:wrap;gap:8px}
.ow-opt{padding:10px 16px;border-radius:14px;border:1px solid var(--glass-border);background:var(--input);color:var(--text);font:inherit;font-size:14.5px;cursor:pointer;transition:all .25s}
.ow-opt:hover{border-color:rgba(141,44,69,.6)}.ow-opt.on{color:#fff;background:linear-gradient(135deg,#96304a,#581825);border-color:transparent;box-shadow:0 6px 18px rgba(88,24,37,.35)}
.ow input[type=text],.ow textarea,.ow input[type=url]{width:100%;padding:13px 16px;border-radius:14px;background:var(--input);border:1px solid var(--line);color:var(--text);font:inherit;font-size:15.5px;outline:0}
.ow textarea{min-height:96px;resize:vertical}.ow input:focus,.ow textarea:focus{border-color:rgba(141,44,69,.8);box-shadow:0 0 0 4px rgba(141,44,69,.2)}
.ow-links{display:grid;gap:8px}.ow-lrow{display:flex;gap:8px}.ow-lrow button{flex:none;width:44px;border-radius:12px;border:1px solid var(--line);background:var(--input);color:var(--text);cursor:pointer;font-size:20px}
.ow-add{margin-top:8px;background:none;border:1px dashed rgba(141,44,69,.6);color:var(--gold-ink);border-radius:12px;padding:9px 14px;cursor:pointer;font:inherit}
.ow-nav{display:flex;gap:10px;margin-top:20px}.ow-nav .btn{flex:1;justify-content:center}.ow-nav .ow-back{flex:none;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:0 20px;cursor:pointer;font:inherit}
.ow-err{color:#d94a5f;font-size:13px;margin-top:8px;min-height:18px}
.ow-sum{background:var(--input);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.9;max-height:280px;overflow:auto}.ow-sum b{color:var(--gold-ink)}

html[dir=rtl] .sc-orbit text{direction:ltr;letter-spacing:0}
/* ===== قطرة ماء زجاجية للجزيرة ===== */
.island{touch-action:none;-webkit-user-select:none;user-select:none}.island a{-webkit-user-drag:none}
.island .pill{transition:transform .45s var(--ease),width .45s var(--ease),height .3s,top .3s,background .3s,box-shadow .3s,border-color .3s}
.island.drag .pill{transition:width .3s var(--spring),top .3s var(--spring),bottom .3s var(--spring),background .3s,box-shadow .3s;z-index:2;pointer-events:none;top:-4px;bottom:-4px;
 background:radial-gradient(120% 140% at 30% 18%,rgba(255,255,255,.55),rgba(255,255,255,.06) 46%,rgba(255,255,255,.14) 100%);
 border:1.5px solid rgba(255,255,255,.7);
 -webkit-backdrop-filter:blur(2px) saturate(1.9) brightness(1.08);backdrop-filter:blur(2px) saturate(1.9) brightness(1.08);

:root{
  --maroon:#581825; --maroon-2:#7a2236; --gold:#DDA254; --gold-2:#f1c88b; --obsidian:#0d080a;
  --gold-3:#c98a38; --gold-rgb:221,162,84; --radius:22px; --ease:cubic-bezier(.22,.8,.24,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{
  --bg:#0d080a; --text:#f4ece6; --text-2:#cdbdb7; --muted:#9d8d89;

  --glass-border:rgba(var(--gold-rgb),.22); --shadow:0 24px 60px rgba(0,0,0,.42);
  --input:rgba(255,255,255,.06); --gold-ink:#DDA254; --line:rgba(255,255,255,.08);
  --mark-body:#f4ece6; --mark-gold:#DDA254; --on-gold:#2a1108;
  --bg-layer:
    radial-gradient(1100px 700px at 88% -8%, rgba(88,24,37,.80), transparent 62%),
    radial-gradient(900px 620px at -5% 34%, rgba(var(--gold-rgb),.09), transparent 60%),
    radial-gradient(900px 700px at 70% 105%, rgba(88,24,37,.55), transparent 60%),
    linear-gradient(180deg,#0d080a,#130910 52%,#0d080a);
}
[data-theme="dark"]{--logo-full:var(--logo-full-cream);--logo-mark:var(--logo-mark-cream);--shine:rgba(255,236,190,.95)}
[data-theme="light"]{
  --bg:#ffffff; --text:#2b1219; --text-2:#58404a; --muted:#7c6269;
  --glass:rgba(255,255,255,.76); --glass-2:rgba(255,255,255,.94); --glass-strong:rgba(255,255,255,.92);
  --glass-border:rgba(107,26,46,.17); --shadow:0 14px 40px rgba(107,26,46,.11);
  --input:rgba(107,26,46,.05); --gold-ink:#6b1a2e; --line:rgba(107,26,46,.11);
  --gold:#6b1a2e; --gold-2:#8d2c45; --gold-3:#4a1220; --gold-rgb:107,26,46; --on-gold:#ffffff; --logo-full:var(--logo-full-maroon); --logo-mark:var(--logo-mark-maroon); --shine:rgba(255,255,255,.95);
  --bg-layer:
    radial-gradient(900px 560px at 92% -8%, rgba(var(--gold-rgb),.16), transparent 62%),
    radial-gradient(800px 540px at -6% 36%, rgba(88,24,37,.06), transparent 60%),
    #ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}

h1,h2,h3,h4{font-family:'Cairo','Tajawal',sans-serif;line-height:1.4;font-weight:700}
a{color:inherit;text-decoration:none}

img{max-width:100%;display:block}

.container{width:min(1180px,100% - 40px);margin-inline:auto}
section{padding:96px 0;scroll-margin-top:84px;position:relative}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== الزجاج ===== */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(var(--gblur,24px)) saturate(var(--gsat,180%));backdrop-filter:blur(var(--gblur,24px)) saturate(var(--gsat,180%));
  border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.09);isolation:isolate}

  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(var(--gold-rgb),.17),transparent 55%);opacity:0;transition:opacity .4s}
.glass:hover::before{opacity:1}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.10),transparent 30%,transparent 70%,rgba(255,255,255,.03))}

/* ===== الأزرار ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 26px;border-radius:999px;font-family:'Cairo',sans-serif;font-weight:600;font-size:15.5px;overflow:hidden;
  transition:transform .35s var(--spring),box-shadow .35s,background .3s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.30) 50%,transparent 70%);transform:translateX(130%);transition:transform .9s var(--ease)}
.btn:hover::after{transform:translateX(-130%)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,var(--gold-3));color:var(--on-gold);box-shadow:0 10px 28px rgba(var(--gold-rgb),.28)}
.btn-glass{background:var(--glass-2);color:var(--text);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}

.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-2);transition:transform .3s var(--spring),color .3s;color:var(--text-2)}
.icon-btn:hover{color:var(--gold-ink);transform:translateY(-2px)}
.icon-btn:active{transform:scale(.92)}

/* ===== عناوين الأقسام ===== */
.sec-head{text-align:center;max-width:720px;margin:0 auto 52px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold-ink);font-family:'Cairo';font-weight:600;font-size:14px;letter-spacing:.04em;margin-bottom:14px}

/* ===== الكشف عند التمرير ===== */
.js .reveal{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js .reveal.shown{opacity:1;transform:none}

/* ===== الهياكل الزجاجية ===== */
.skeleton{position:relative;overflow:hidden;background:rgba(255,255,255,.045);border:1px solid var(--glass-border);border-radius:var(--radius)}

@keyframes scan{0%{transform:translateY(-70px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(70px);opacity:0}}

.pre-hint{position:absolute;bottom:26px;inset-inline:0;text-align:center;font-size:13px;color:rgba(244,236,230,.4)}

/* ===== شريط التنقل ===== */
.nav{position:fixed;top:14px;inset-inline:0;z-index:60;display:flex;justify-content:center;pointer-events:none}

.soc.sm{width:34px;height:34px;border-radius:11px}.soc.sm .ic{width:18px;height:18px}
.soc.lg{width:58px;height:58px;border-radius:19px}.soc.lg .ic{width:29px;height:29px}
.soc.fb{background:#1877F2}.soc.tg{background:#26A5E4}
.soc.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.soc-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.nav-tools{display:flex;gap:8px}
.nav-tools .icon-btn{width:38px;height:38px}
.menu-btn{display:none}
.sound-off,.theme-sun{display:none}
[data-muted="1"] .sound-on{display:none}[data-muted="1"] .sound-off{display:block}
[data-theme="light"] .theme-moon{display:none}[data-theme="light"] .theme-sun{display:block}
.sheet{position:fixed;inset:0;z-index:70;display:none;background:rgba(8,4,6,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet.open{display:block}
.sheet-card{position:absolute;top:14px;inset-inline:12px;padding:20px;border-radius:28px;background:var(--glass-strong);animation:sheetIn .45s var(--spring)}
@keyframes sheetIn{from{opacity:0;transform:translateY(-14px) scale(.97)}}
.sheet-card a.s-link{display:flex;align-items:center;justify-content:space-between;padding:13px 6px;border-bottom:1px solid var(--line);font-family:'Cairo';font-weight:600}
.sheet-social{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* ===== الهيرو ===== */
.hero{padding-top:150px;padding-bottom:70px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero .tag{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;font-size:13.5px;color:var(--text-2);margin-bottom:22px}
.hero .tag i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.2)}
.hero h1{font-size:clamp(38px,6vw,68px);margin-bottom:20px;letter-spacing:-.01em}
.hero p.lead{font-size:clamp(17px,2vw,20px);color:var(--text-2);max-width:580px;margin-bottom:32px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.emblem{position:relative;display:grid;place-items:center;min-height:460px;overflow:hidden}
.emblem-glow{position:absolute;width:440px;height:440px;max-width:100%;border-radius:50%;background:radial-gradient(circle,rgba(var(--gold-rgb),.24),transparent 66%);filter:blur(8px)}
.emblem-ring{position:absolute;width:390px;height:390px;max-width:92%;aspect-ratio:1;border-radius:50%;border:1px dashed rgba(var(--gold-rgb),.35);animation:spin 60s linear infinite}
.emblem-ring.b{width:330px;height:330px;border-style:solid;border-color:rgba(var(--gold-rgb),.14);animation-direction:reverse}
.emblem-logo{position:relative;width:min(290px,64%);aspect-ratio:720/1025;background:var(--logo-full) center/contain no-repeat;filter:drop-shadow(0 18px 36px rgba(88,24,37,.32));animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:70px}
.stat{padding:26px 22px;text-align:center}
.stat b{display:block;font-family:'Cairo';font-size:clamp(32px,4vw,46px);line-height:1.2;color:var(--gold-ink)}
.stat span{display:block;color:var(--text-2);font-size:15px;margin-top:6px}

/* ===== المؤسس ===== */
.founder{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;padding:44px;max-width:960px;margin-inline:auto}
.ring{position:relative;width:230px;height:230px;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,var(--gold),rgba(var(--gold-rgb),.1),var(--gold-2),rgba(88,24,37,.6),var(--gold));animation:spin 14s linear infinite;box-shadow:0 0 50px rgba(var(--gold-rgb),.28)}
.ring-in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#1a0c11;animation:spin 14s linear infinite reverse;position:relative}
.ring-in img{width:100%;height:100%;object-fit:cover;object-position:50% 34%}
.ring-in::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(140deg,rgba(255,255,255,.22),transparent 38%);pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.founder h3{font-size:clamp(22px,3vw,30px);margin-bottom:6px}
.founder .role{color:var(--gold-ink);font-family:'Cairo';font-weight:600;margin-bottom:14px}
.founder p{color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{padding:5px 14px;border-radius:999px;font-size:13.5px;border:1px solid var(--glass-border);color:var(--text-2);background:var(--glass)}

/* ===== الخدمات ===== */
.grid-services{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.service{padding:30px 26px;display:flex;flex-direction:column;gap:12px;transition:transform .45s var(--ease),border-color .3s}
.service:hover{transform:translateY(-6px);border-color:rgba(var(--gold-rgb),.5)}
.s-ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:25px;color:var(--on-gold);background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 8px 22px rgba(var(--gold-rgb),.28)}
.service h3{font-size:19px}
.service p{color:var(--text-2);font-size:15.5px;flex:1}
.service a.more{display:inline-flex;align-items:center;gap:8px;color:var(--gold-ink);font-family:'Cairo';font-weight:600;font-size:14.5px}
.service a.more .ic{transition:transform .3s}.service a.more:hover .ic{transform:translateX(-5px)}

/* ===== المعرض ===== */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.tab{padding:10px 22px;border-radius:999px;font-family:'Cairo';font-weight:600;font-size:15px;color:var(--text-2);border:1px solid var(--glass-border);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:all .35s var(--spring)}
.tab:hover{color:var(--gold-ink)}
.tab.active{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--on-gold);border-color:transparent;box-shadow:0 8px 22px rgba(var(--gold-rgb),.3)}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;text-align:start;overflow:hidden;cursor:pointer;width:100%;transition:transform .45s var(--ease),border-color .3s}
.tile:hover{transform:translateY(-5px);border-color:rgba(var(--gold-rgb),.5)}
.tile-cover{position:relative;aspect-ratio:16/10;overflow:hidden}
.tile-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile-body{display:flex;align-items:center;gap:14px;padding:16px 18px}
.tile-ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:20px;color:var(--on-gold);background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 16px rgba(var(--gold-rgb),.25)}
.tile-name{font-family:'Cairo';font-weight:600;font-size:15.5px;line-height:1.55}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px}

/* ===== النوافذ المنبثقة ===== */
.modal{position:fixed;inset:0;z-index:600;display:none;place-items:center;padding:18px;background:rgba(8,4,6,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal.open{display:grid}
.modal-card{width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:28px;background:var(--glass-strong);animation:pop .45s var(--spring);position:relative}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(12px)}}
.modal-x{position:absolute;top:14px;left:14px;z-index:3;width:38px;height:38px}
.modal-body{padding:26px}
.modal-body h3{font-size:22px;margin-bottom:8px}
.modal-body p{color:var(--text-2);margin-bottom:18px}
.modal .tile-cover{border-radius:0;cursor:zoom-in;transition:transform .5s var(--ease)}
.modal .tile-cover.zoomed{transform:scale(1.5);cursor:zoom-out;z-index:2}
.modal-card.zoomwrap{overflow:hidden}

/* ===== الدفع ===== */
.pay-hint{text-align:center;color:var(--muted);font-size:14.5px;margin:-22px 0 30px}
.pay-logos{display:grid;grid-template-columns:repeat(4,max-content);justify-content:center;gap:16px}
.pay-tile{width:78px;height:78px;border-radius:22px;display:block;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.26),0 0 0 1px var(--glass-border);transition:transform .4s var(--spring),box-shadow .35s;-webkit-tap-highlight-color:transparent}
.pay-tile:hover{transform:translateY(-6px) scale(1.05);box-shadow:0 18px 40px rgba(0,0,0,.32),0 0 0 2px var(--gold)}
.pay-tile:active{transform:scale(.95)}
.pl{display:block;width:100%;height:100%;border-radius:inherit;background-repeat:no-repeat;background-position:center}
.pl-insta{background-color:#fff;background-image:var(--pay-instapay);background-size:76% auto}
.pl-voda{background-color:#e60000;background-image:var(--pay-vodafone);background-size:cover}
.pl-misr{background-color:#8c1930;background-image:var(--pay-misr);background-size:cover}
.pl-wu{background-color:#fff;background-image:var(--pay-wu);background-size:82% auto}
.pm-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.pm-logo{width:68px;height:68px;border-radius:20px;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.25),0 0 0 1px var(--glass-border);overflow:hidden}
.pm-head h3{margin:0}.pm-head small{color:var(--muted);font-size:13.5px}
.pay-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.pay-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:14px;background:var(--input);border:1px solid var(--line)}
.pay-row>div{min-width:0}
.pay-row small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.pay-row .val{font-family:'Cairo',monospace;font-weight:600;font-size:15.5px;word-break:break-all}
.pay-row .val.ltr{direction:ltr;text-align:right;letter-spacing:.02em}
.copy{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--glass-border);background:var(--glass-2);color:var(--gold-ink);flex:none;transition:transform .3s var(--spring)}
.copy:active{transform:scale(.88)}
.copy.done{background:var(--gold);color:var(--on-gold)}
.pay-actions{display:flex;gap:10px;flex-wrap:wrap}
.pay-note{font-size:13.5px;color:var(--text-2);line-height:1.7;margin-bottom:16px}
.notice{margin-top:34px;padding:22px 26px;display:flex;gap:18px;align-items:flex-start;border-color:rgba(var(--gold-rgb),.4);background:linear-gradient(135deg,rgba(var(--gold-rgb),.12),var(--glass))}
.notice .s-ico{width:46px;height:46px;font-size:21px;border-radius:14px;flex:none}
.notice b{font-family:'Cairo';color:var(--gold-ink)}

/* ===== التقييمات ===== */
.grid-rev{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.rev{padding:24px;display:flex;flex-direction:column;gap:12px}
.stars{display:inline-flex;gap:3px;color:#e0a030;font-size:17px}
.stars .off{color:var(--line)}
.rev p{color:var(--text-2);font-size:15.5px;flex:1}
.rev .who{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:'Cairo';font-weight:700;background:linear-gradient(135deg,var(--maroon-2),var(--maroon));color:#f1d6a6;border:1px solid var(--glass-border)}
.rev .who b{font-family:'Cairo';font-size:15.5px;display:block;line-height:1.3}
.rev .who small{color:var(--muted);font-size:12.5px}
.tag-sample{display:inline-block;margin-inline-start:8px;padding:2px 10px;border-radius:999px;font-size:11.5px;font-family:'Cairo';font-weight:600;color:var(--muted);border:1px dashed var(--glass-border);vertical-align:middle}
.rev-form{margin-top:34px;padding:30px;max-width:720px;margin-inline:auto}
.rev-form h3{margin-bottom:6px}
.star-input{display:inline-flex;flex-direction:row-reverse;gap:4px;font-size:30px}
.star-input input{position:absolute;opacity:0;width:1px;height:1px}
.star-input label{cursor:pointer;color:var(--line);transition:color .2s,transform .3s var(--spring);line-height:1}
.star-input label:hover,.star-input label:hover~label,.star-input input:checked~label{color:var(--gold)}
.star-input label:active{transform:scale(.85)}
.star-input input:focus-visible+label{outline:2px solid var(--gold);border-radius:6px}

/* ===== النماذج ===== */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:14px;color:var(--text-2);font-weight:500}
.field input,.field select,.field textarea,.in{width:100%;padding:13px 16px;border-radius:14px;background:var(--input);border:1px solid var(--line);color:var(--text);font:inherit;font-size:15.5px;transition:border-color .3s,box-shadow .3s}
.field select option{background:#1a0c11;color:#f4ece6}
[data-theme="light"] .field select option{background:#fff;color:#2b1219}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.in:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.16)}
.field ::placeholder{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;clip-path:inset(50%)}
.contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px;align-items:start}
.contact-info{padding:34px 28px;display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.contact-info h3{font-size:19px}
.contact-info p{color:var(--text-2);font-size:15px}
.c-link{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:16px;transition:background .3s;border:1px solid var(--line);width:100%}
.c-link:hover{background:var(--glass-2)}
.c-link .ci{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--glass-border);color:var(--gold-ink);font-size:20px;background:var(--glass)}
.c-link b{display:block;font-family:'Cairo';font-size:15px;line-height:1.3;text-align:start}
.c-link small{color:var(--muted);font-size:13px;direction:ltr;display:block;text-align:right}
.contact-form{padding:32px}
.msg{font-size:14px;margin-top:10px;min-height:22px}
.msg.err{color:#e58a8a}.msg.ok{color:var(--gold-ink)}

/* ===== الفوتر ===== */
footer{padding:40px 0 130px;margin-top:30px;position:relative}
.foot-cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:30px 36px;margin-bottom:22px;color:#fff;border-radius:30px;
  background:linear-gradient(135deg,#a3294a 0%,#7a1d36 38%,#4a0f1f 100%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 50px rgba(88,24,37,.35)}
.foot-cta::before{content:'';position:absolute;inset-inline-end:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.foot-cta h3{font-size:clamp(20px,3vw,26px);margin-bottom:4px;position:relative}
.foot-cta p{opacity:.85;font-size:15.5px;position:relative}
.foot-cta-btns{display:flex;gap:12px;flex-wrap:wrap;position:relative}
.btn-light{background:#fff;color:#581825;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.btn-outline-w{border:1px solid rgba(255,255,255,.55);color:#fff;background:rgba(255,255,255,.08)}
.foot{position:relative;padding:50px 44px 24px;overflow:hidden;border-radius:34px}
.foot-line{position:absolute;top:0;inset-inline:10%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.85}
.foot-aura{position:absolute;inset-inline:0;top:-120px;height:340px;background:radial-gradient(520px 260px at 50% 0,rgba(var(--gold-rgb),.14),transparent 70%);pointer-events:none}
.foot-grid{position:relative;display:grid;grid-template-columns:1.2fr .8fr .9fr 1.1fr;gap:38px;align-items:start}
.foot-brand{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.foot-slogan{font-family:'Cairo';font-size:21px;font-weight:700}
.foot-col h4{font-size:16px;color:var(--gold-ink);margin-bottom:14px;position:relative;padding-bottom:10px}
.foot-col h4::after{content:'';position:absolute;bottom:0;inset-inline-start:0;width:30px;height:2px;border-radius:2px;background:var(--gold)}
.foot-col a,.foot-col .fl,.fl-btn{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--text-2);font-size:15px;transition:color .3s,transform .3s;text-align:start}
.foot-col a:hover,.fl-btn:hover{color:var(--gold-ink);transform:translateX(-4px)}
.foot-col .btn{margin-top:12px}
.hours{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--input);border:1px solid var(--line);margin-bottom:8px}
.hr-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--on-gold);background:linear-gradient(135deg,var(--gold-2),var(--gold));font-size:20px}
.hours b{font-family:'Cairo';font-size:14.5px;display:block;line-height:1.5}
.hours small{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hours small::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--muted)}
.hours small.on{color:#1f9d5c}.hours small.on::before{background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.2)}
.foot-bottom{position:relative;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.foot-bottom .pol{display:flex;gap:18px;flex-wrap:wrap}
.foot-bottom .pol button{color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:4px}
.foot-bottom .pol button:hover{color:var(--gold-ink)}
.policy ul{padding-inline-start:20px;display:flex;flex-direction:column;gap:10px;color:var(--text-2);margin-bottom:6px}
.policy .upd{margin-top:14px;font-size:13px;color:var(--muted)}
/* شعار الفوتر: كشف انسيابي من اليمين ثم لمعة */
.logo-reveal{position:relative;width:min(190px,52vw);aspect-ratio:720/1025;cursor:pointer;margin:6px 0 4px;-webkit-tap-highlight-color:transparent}
.logo-reveal::before{content:'';position:absolute;inset:-14% -34%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--gold-rgb),.2),transparent 72%);animation:breath 5s ease-in-out infinite}
.logo-reveal::after{content:'';position:absolute;inset:-6% -26%;border-radius:50%;border:1px dashed rgba(var(--gold-rgb),.28);animation:spin 50s linear infinite}
@keyframes breath{50%{transform:scale(1.08);opacity:.7}}
.lr-base,.lr-shine{position:absolute;inset:0;z-index:1}
.lr-base{background:var(--logo-full) center/contain no-repeat;
  -webkit-mask-image:linear-gradient(to left,#000 0,#000 44%,transparent 56%);mask-image:linear-gradient(to left,#000 0,#000 44%,transparent 56%);
  -webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0% 0;mask-position:0% 0}
.lr-shine{background:linear-gradient(105deg,transparent 42%,var(--shine) 50%,transparent 58%) 100% 0/300% 100% no-repeat;
  -webkit-mask:var(--logo-full) center/contain no-repeat;mask:var(--logo-full) center/contain no-repeat;opacity:0}
.logo-reveal.go .lr-base{animation:inkIn 2.6s cubic-bezier(.65,0,.25,1) forwards}
.logo-reveal.go .lr-shine{animation:shineSweep 2.2s 2.5s ease-in-out forwards}
@keyframes inkIn{from{-webkit-mask-position:0% 0;mask-position:0% 0}to{-webkit-mask-position:100% 0;mask-position:100% 0}}
@keyframes shineSweep{0%{opacity:1;background-position:100% 0}100%{opacity:1;background-position:0% 0}}

/* ===== شريط الجزيرة للهاتف + واتساب ===== */
.island-wrap{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom));display:none;justify-content:center;align-items:center;gap:10px;z-index:65;pointer-events:none}
.island{pointer-events:auto;position:relative;display:flex;padding:6px;border-radius:999px;background:var(--glass-strong);box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.island a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 17px;border-radius:999px;font-family:'Cairo';font-size:11.5px;font-weight:600;line-height:1.5;color:var(--text-2);transition:color .35s;-webkit-tap-highlight-color:transparent}
.island a .ic{font-size:21px}
.island a.active{color:var(--on-gold)}
.island .pill{position:absolute;top:6px;bottom:6px;left:0;width:60px;border-radius:999px;background:linear-gradient(135deg,var(--gold-2),var(--gold));box-shadow:0 6px 18px rgba(var(--gold-rgb),.38);transition:transform .45s var(--ease),width .45s var(--ease);z-index:0;will-change:transform,width}
.island-cta{pointer-events:auto;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:var(--on-gold);background:linear-gradient(135deg,var(--gold-2),var(--gold-3));box-shadow:0 12px 30px rgba(var(--gold-rgb),.5),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .35s var(--spring);animation:glowpulse 3s ease-in-out infinite}

@keyframes glowpulse{50%{box-shadow:0 12px 40px rgba(var(--gold-rgb),.8),inset 0 1px 0 rgba(255,255,255,.5)}}
.wa-float{position:fixed;left:22px;bottom:22px;z-index:65;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#25D366;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(37,211,102,.45);box-shadow:0 14px 36px rgba(0,0,0,.35),0 0 0 0 rgba(37,211,102,.4);animation:waPulse 2.8s infinite;transition:transform .35s var(--spring)}
.wa-float:hover{transform:scale(1.08)}
@keyframes waPulse{70%{box-shadow:0 14px 36px rgba(0,0,0,.35),0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 14px 36px rgba(0,0,0,.35),0 0 0 0 rgba(37,211,102,0)}}

/* ===== تنبيهات ===== */
.toasts{position:fixed;top:84px;inset-inline:0;z-index:2000;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;padding:0 14px}
.toast{pointer-events:auto;max-width:min(520px,100%);padding:13px 22px;border-radius:999px;font-size:15px;background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--shadow);animation:toastIn .5s var(--spring);display:flex;align-items:center;gap:10px}
.toast.err{border-color:rgba(224,90,90,.5)}
.toast.out{opacity:0;transform:translateY(-10px);transition:all .4s}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.94)}}

/* ===== السلايدر المجسّم (Coverflow) ===== */
.cf{position:relative;overflow:hidden;padding:18px 0 4px;--cfw:min(400px,80vw)}
.cf-stage{position:relative;width:100%;perspective:1500px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.cf-stage.dragging{cursor:grabbing}
.container .cf{width:100vw;margin-inline:calc(50% - 50vw)}
.cf-item{position:absolute;top:0;left:50%;width:var(--cfw);margin-left:calc(var(--cfw) / -2);will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf-stage.dragging .cf-item{transition:none}
.cf-item img{-webkit-user-drag:none;user-select:none}
.cf-ui{display:none!important}
.cf-ui-x{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:26px}
.cf-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--glass-border);background:var(--glass-2);color:var(--gold-ink);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .35s var(--spring),background .3s,color .3s}
.cf-btn:hover{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--on-gold);transform:scale(1.08)}
.cf-btn:active{transform:scale(.92)}
.cf-btn.prev .ic{transform:scaleX(-1)}
.cf-dots{display:flex;align-items:center;gap:8px;min-width:60px;justify-content:center}
.cf-dot{width:8px;height:8px;border-radius:99px;background:rgba(var(--gold-rgb),.28);transition:width .45s var(--ease),background .3s;padding:0}
.cf-dot.on{width:28px;background:linear-gradient(90deg,var(--gold-2),var(--gold))}
.cf-count{direction:ltr;unicode-bidi:isolate;font-family:'Cairo';font-weight:600;font-size:14px;color:var(--text-2);letter-spacing:.04em}
.cf:focus-visible{outline:2px solid var(--gold);outline-offset:-4px;border-radius:24px}
/* بطاقات الخدمات داخل السلايدر */
.cf-svc{--cfw:min(390px,80vw)}
.cf-svc .service{padding:34px 30px;gap:14px;transition:transform .85s var(--ease),opacity .6s var(--ease),border-color .4s,box-shadow .5s}
.cf-svc .service:hover{transform:none}
.cf-svc .cf-item.is-active.service{border-color:rgba(var(--gold-rgb),.55);box-shadow:var(--shadow),0 0 0 1px rgba(var(--gold-rgb),.25),0 24px 60px rgba(var(--gold-rgb),.16)}
.cf-svc .s-ico{width:62px;height:62px;border-radius:50%;font-size:28px}
.cf-svc .service h3{font-size:20px}
.cf-tile{--cfw:min(280px,68vw)}
.cf-tile .tile.cf-item{width:var(--cfw);transition:transform .85s var(--ease),opacity .6s var(--ease),border-color .4s}
.cf-tile .tile:hover{transform:none}
.cf-tile .tile-body{flex-direction:column;text-align:center;padding:26px 18px;gap:14px;flex:1;justify-content:center}
.cf-tile .tile-ic{width:58px;height:58px;border-radius:50%;font-size:26px}
.cf-tile .tile-cover{aspect-ratio:16/10}
.cf-tile .tile-name{font-size:16px}
.cf-rev{--cfw:min(430px,82vw)}
.cf-rev .rev{padding:30px 28px 26px;align-items:center;text-align:center;gap:14px;overflow:hidden}
.cf-rev .rev .qt{position:absolute;top:16px;inset-inline-start:18px;width:46px;height:46px;color:rgba(var(--gold-rgb),.16);stroke-width:1.4}
.cf-rev .rev p{flex:1;font-size:16px;line-height:1.95}
.cf-rev .rev .who{flex-direction:column;gap:6px;text-align:center}
.av{--c1:#8d2c45;--c2:#581825}
.av.c1{--c1:#b07a2e;--c2:#7a4a12}.av.c2{--c1:#7a2236;--c2:#3d101a}.av.c3{--c1:#a1334d;--c2:#581825}.av.c4{--c1:#c98a38;--c2:#8a5a1a}.av.c5{--c1:#6b1a2e;--c2:#2f0a12}
.rev .av{width:68px;height:68px;font-size:30px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));border:3px solid rgba(var(--gold-rgb),.35);box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.25)}
.rev .who b{font-size:16.5px}
/* البنرات */
#banners{padding:104px 0 10px;scroll-margin-top:0}
#banners .cf{--cfw:min(900px,80vw);padding-block:26px 4px}
.bn{border-radius:28px;overflow:hidden;border:1px solid var(--glass-border);box-shadow:0 30px 70px rgba(0,0,0,.4);background:#2a0c14}
.bn img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.bn::after{content:'';position:absolute;inset:0;background:rgba(13,8,10,.5);transition:opacity .8s var(--ease);pointer-events:none}
.bn.is-active::after{opacity:0}
.bn::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.34) 50%,transparent 62%);transform:translateX(-120%)}
.bn.is-active::before{animation:bnSweep 1.6s .5s var(--ease) 1}
@keyframes bnSweep{to{transform:translateX(120%)}}
.bn.is-active img{animation:kb 8s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
body.has-bn .hero{padding-top:50px}
body.has-bn #banners{display:block}
/* الإحصاءات */
.stat-ic{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:25px;color:var(--on-gold);background:linear-gradient(135deg,var(--gold-2),var(--gold) 60%,var(--gold-3));box-shadow:0 10px 26px rgba(var(--gold-rgb),.32),inset 0 1px 0 rgba(255,255,255,.35);position:relative}

::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
.theme-ripple{position:fixed;z-index:9998;border-radius:50%;pointer-events:none;border:2px solid var(--gold);transform:translate(-50%,-50%) scale(0);opacity:.9}

/* دخول الإدارة */

/* بطاقة تنزيل التطبيق */
.app-sec{padding:70px 0 30px}
.app-card{position:relative;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:48px 52px;border-radius:36px;background:linear-gradient(135deg,rgba(var(--gold-rgb),.14),var(--glass) 55%)}
.app-card::before{content:'';position:absolute;inset-inline-start:-80px;top:-100px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(var(--gold-rgb),.22),transparent 68%);z-index:-1;opacity:1!important}
.app-card h2{font-size:clamp(26px,3.6vw,38px);margin:10px 0 12px}

.app-feats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}

.plat-row{margin-top:22px;padding-top:18px;border-top:1px dashed var(--glass-border)}

.plat{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:16px;background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text);font-family:'Cairo';font-weight:700;font-size:14.5px;transition:transform .35s var(--spring),border-color .3s,box-shadow .3s}
.plat:hover{transform:translateY(-3px);border-color:rgba(var(--gold-rgb),.55);box-shadow:0 10px 24px rgba(var(--gold-rgb),.22)}

@media(max-width:520px){.plat-list{gap:8px}.plat{flex-direction:column;gap:6px;padding:12px 6px;font-size:13.5px;text-align:center}.plat-ic{width:26px;height:26px}}
.plat{justify-content:center}
.app-pick{margin-bottom:22px}
.app-pick>small{display:block;color:var(--muted);font-size:13.5px;margin-bottom:10px;font-family:'Cairo';font-weight:600}

.app-sw{display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:999px;border:1.5px solid var(--glass-border);background:var(--glass);font-family:'Cairo';font-weight:600;font-size:14.5px;color:var(--text-2);transition:all .4s var(--spring)}
.app-sw .sw{width:44px;height:44px;border-radius:13px;background-size:cover;box-shadow:0 6px 16px rgba(0,0,0,.28);border:1px solid rgba(128,128,128,.25)}
.app-sw.on{border-color:var(--gold);color:var(--text);background:rgba(var(--gold-rgb),.12);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.14);transform:translateY(-2px)}
.btn-lg{padding:16px 34px;font-size:17px}
.app-hint{display:block;margin-top:12px;color:var(--muted);font-size:13px;min-height:20px}
.app-visual{position:relative;display:grid;place-items:center;min-height:420px}
.app-orb{position:absolute;width:360px;height:360px;border-radius:50%;border:1px dashed rgba(var(--gold-rgb),.35);animation:spin 40s linear infinite}
.app-orb.b{width:280px;height:280px;border-style:solid;border-color:rgba(var(--gold-rgb),.14);animation-direction:reverse}
.phone{position:relative;width:206px;height:410px;border-radius:38px;padding:9px;background:linear-gradient(145deg,#2b2024,#0e080a);box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,255,255,.14);animation:float 7s ease-in-out infinite}
.phone-scr{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:radial-gradient(120% 80% at 70% 0,#7a2236,#3d101a 55%,#1a080e);padding:46px 16px 16px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;gap:16px 10px;align-content:start}

.ph-app.me::after{content:'';position:absolute;inset:-5px;border-radius:18px;border:2px solid var(--gold);animation:ring 2.4s ease-out infinite}
@keyframes appDrop{from{transform:translateY(-120px) scale(.4) rotate(-14deg);opacity:0}}

.wa-float,.island-cta{background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,var(--gold-3))!important;color:var(--on-gold)!important;border:1px solid rgba(255,255,255,.3)!important}

#preloader{background:rgba(13,8,10,.5)!important;-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);transition:opacity .6s var(--ease),visibility .6s}

.pl-logo-wrap{position:relative;width:128px;aspect-ratio:720/1025;margin-top:-34px;animation:plIn 1.15s cubic-bezier(.2,.9,.25,1.1) both,plFloat 3.2s 1.2s ease-in-out infinite}
.pl-logo{position:absolute;inset:0;background:var(--logo-full-cream) center/contain no-repeat;filter:drop-shadow(0 0 22px rgba(var(--gold-rgb),.45));animation:plReveal 1.1s .1s cubic-bezier(.65,0,.25,1) both}
.pl-shine{position:absolute;inset:0;-webkit-mask:var(--logo-full-cream) center/contain no-repeat;mask:var(--logo-full-cream) center/contain no-repeat;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) 160% 0/250% 100% no-repeat;animation:plShine 1.2s .9s ease-in-out both}
@keyframes plIn{from{opacity:0;transform:perspective(600px) rotateY(-80deg) scale(.45);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
@keyframes plReveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes plShine{from{background-position:160% 0}to{background-position:-60% 0}}
@keyframes plFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pl-glow{position:absolute;width:300px;height:300px;margin-top:-34px;border-radius:50%;background:radial-gradient(circle,rgba(var(--gold-rgb),.28),rgba(122,34,54,.25) 45%,transparent 70%);animation:plGlow 1.4s ease-out both}
@keyframes plGlow{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

@keyframes plRing{from{transform:scale(.55);opacity:.9}to{transform:scale(1.75);opacity:0}}

@keyframes plSpin{to{transform:rotate(360deg)}}@keyframes plFade{from{opacity:0}}

@keyframes chipIn{from{opacity:0;transform:scale(.4) translateY(20px)}to{opacity:1;transform:none}}

.m-thumb{position:relative;overflow:hidden;border-radius:14px;background:var(--input);border:1px dashed var(--glass-border);display:grid;place-items:center;color:var(--muted);font-size:13px;width:100%}
.m-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m-thumb.round{border-radius:50%;width:130px;margin-inline:auto}
.ed-frame{position:relative;overflow:hidden;margin:0 auto 14px;width:100%;max-width:400px;border-radius:20px;background:#1a0c11;border:1px solid var(--glass-border);touch-action:none;cursor:grab;user-select:none}
.ed-frame.drag{cursor:grabbing}
.ed-frame.round{border-radius:50%;max-width:280px}
.ed-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.ed-frame.empty-f img{display:none}
.ed-frame.empty-f::before{content:'اختر صورة لتظهر هنا';position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.ed-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hint{color:var(--muted);font-size:13.5px;text-align:center;margin-bottom:14px}
input[type=range]{width:100%;accent-color:#8d2c45}
.steps{padding-inline-start:20px;color:var(--text-2);display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.inv-stage{background:#e9dfdb!important}
@media(max-width:1020px){.inv-layout{grid-template-columns:1fr}}

.bn-adm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
.bn-adm{border-radius:18px;overflow:hidden;border:1px solid var(--glass-border);background:var(--input)}
.bn-adm img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.bn-adm.is-off img{opacity:.35;filter:grayscale(.7)}
.bn-meta{display:flex;align-items:center;gap:8px;padding:10px 12px}
.bn-meta .grow{flex:1}
.bn-meta .icon-btn{width:36px;height:36px}

/* ===== إضافات اللوحة ===== */
.note{color:var(--text-2);font-size:14.5px;margin-bottom:14px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-border);flex-wrap:wrap}
.seg button{padding:8px 16px;border-radius:999px;font-family:'Cairo';font-weight:600;font-size:14px;color:var(--text-2);transition:background .3s,color .3s}
.seg button.on{background:linear-gradient(135deg,rgba(141,44,69,.9),rgba(88,24,37,.9));color:#fff;box-shadow:0 6px 16px rgba(88,24,37,.35)}
.seg button i{font-style:normal;opacity:.75;margin-inline-start:4px;font-size:12.5px}
.save-state{font-size:13px;color:var(--muted);align-self:center;flex:1;min-width:120px}.save-state.ok{color:#2f9d62}.save-state.wait{color:var(--gold-ink)}.save-state.err{color:#d25b6e}
.code-row{display:flex;gap:8px}.code-row .in{flex:1}
.code-on{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;border-radius:14px;background:rgba(141,44,69,.14);border:1px solid rgba(141,44,69,.4)}
.code-on span{display:inline-flex;align-items:center;gap:8px}
.chip-code{display:inline-block;padding:3px 10px;border-radius:8px;background:rgba(141,44,69,.14);border:1px solid rgba(141,44,69,.35);font-family:monospace;font-size:13px;letter-spacing:.5px}
.u-cell{display:flex;align-items:center;gap:10px}.u-cell small{display:block;color:var(--muted);font-size:12px}
.u-av{display:grid;place-items:center;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#8d2c45,#581825);color:#fff;font-family:'Cairo';font-weight:700;flex:none}
.u-av img{width:100%;height:100%;object-fit:cover}
.sw{display:inline-flex;align-items:center;gap:12px;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:46px;height:26px;border-radius:999px;background:var(--input);border:1px solid var(--line);position:relative;transition:background .3s,border-color .3s;flex:none}
.sw i::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--text-2);transition:transform .35s var(--spring),background .3s}
.sw input:checked+i{background:linear-gradient(135deg,#8d2c45,#581825);border-color:transparent}
.sw input:checked+i::after{transform:translateX(-20px);background:#fff}
.sw input:focus-visible+i{box-shadow:0 0 0 4px rgba(141,44,69,.25)}
.pay-off-row{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:700px){.pay-off-row{grid-template-columns:1fr}}
.ct-f label{display:flex;align-items:center;gap:10px}
.ct-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#8d2c45,#581825);color:#fff;flex:none}
.ct-ic .ic{width:16px;height:16px}
.ct-st{margin-inline-start:auto;font-size:12px;color:var(--muted)}.ct-st.on{color:#2f9d62}
.st-hero{position:relative;overflow:hidden;isolation:isolate;padding:30px 28px;border-radius:28px;margin-bottom:16px;color:#fff;background:radial-gradient(120% 90% at 12% 0%,rgba(255,255,255,.28),transparent 46%),radial-gradient(70% 80% at 92% 110%,rgba(255,92,128,.38),transparent 70%),linear-gradient(145deg,#c01b48 0%,#8f1235 38%,#5a0a20 72%,#34050f 100%);border:1px solid rgba(255,170,190,.35);box-shadow:0 22px 50px rgba(120,10,40,.42),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -26px 48px rgba(20,0,6,.38)}
.st-hero::before{content:'';position:absolute;z-index:-1;inset:0 0 52% 0;border-radius:28px 28px 60% 60%/28px 28px 22% 22%;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.03));pointer-events:none}
.st-hero small{display:block;opacity:.8;font-size:14px}
.st-hero b{display:block;font-family:'Cairo';font-size:clamp(32px,8vw,54px);font-weight:800;line-height:1.2;margin:6px 0 10px;color:#fff;text-shadow:0 2px 14px rgba(40,0,10,.55),0 1px 0 rgba(255,255,255,.25);word-break:break-word}
.st-hero b em,.kpi b em{font-style:normal;font-size:.45em;opacity:.8;-webkit-text-fill-color:currentColor}
.hero-sub{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14px;opacity:.96}.hero-sub i{font-style:normal;font-weight:700;color:#fff}
.hero-orb{position:absolute;z-index:-1;width:300px;height:300px;inset-inline-start:-90px;bottom:-140px;border-radius:50%;border:1px dashed rgba(255,255,255,.28);animation:invSpin 30s linear infinite}
.hero-orb::after{content:'';position:absolute;inset:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.st-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 14px;margin-bottom:16px}
.st-custom{display:flex;gap:10px;flex-wrap:wrap}.st-custom label{display:flex;align-items:center;gap:8px;font-size:14px}
.k-main b{color:#8d2c45}.k-ok b{color:#2f9d62}.k-dep b{color:#b06d12}.k-pen b{color:#a12c3f}.kpi-mute b{color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:190px;padding-top:10px}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar span{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#a1334d,#581825);transition:height .6s var(--spring);min-height:2px}
.bar span.z{background:var(--line)}
.bar i{font-style:normal;font-size:11px;color:var(--muted)}
.glass-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:800px){.glass-grid{grid-template-columns:1fr}}
.gl-prev{position:relative;min-height:290px;border-radius:24px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#2a0e16,#581825)}
.gl-prev i{position:absolute;border-radius:50%;filter:blur(2px)}
.gl-prev .b1{width:150px;height:150px;background:#DDA254;inset-inline-start:8%;top:10%}.gl-prev .b2{width:120px;height:120px;background:#c2415f;inset-inline-end:10%;bottom:8%}.gl-prev .b3{width:70px;height:70px;background:#fff;inset-inline-end:30%;top:14%;opacity:.7}
.gl-card{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 34px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(var(--gblur,24px)) saturate(var(--gsat,180%));backdrop-filter:blur(var(--gblur,24px)) saturate(var(--gsat,180%));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 20px 44px rgba(0,0,0,.35);color:#fff;text-align:center}
.gl-card small{opacity:.8}
.gl-btn{margin-top:8px;padding:8px 22px;border-radius:999px;background:var(--glass-2);border:1px solid rgba(255,255,255,.3);font-family:'Cairo';font-weight:600;font-size:14px}

.st-filters .gsel{width:170px;flex:none}


/* ===== شعارات الدفع + المبيعات اليدوية ===== */
.pay-mini{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background-position:center;background-repeat:no-repeat;display:grid;place-items:center;overflow:hidden}
.pay-mini.pay-bank{background:linear-gradient(135deg,#8d2c45,#581825);color:#fff;border-color:transparent}.pay-mini.pay-bank .ic{width:22px;height:22px}
.pay-off-row{display:grid;grid-template-columns:44px minmax(180px,1fr) 2fr;gap:12px;align-items:center}
.pay-grp{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.pay-grp:first-child{margin-top:0;padding-top:0;border-top:0}.pay-grp b{font-family:'Cairo';font-size:16px}
.man-form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;margin-bottom:12px}
.man-form .man-note{grid-column:1/3}.man-form .btn{width:100%}
.st-custom{display:flex;gap:10px;flex-wrap:wrap}.st-custom label{display:flex;align-items:center;gap:8px;font-size:14px}.st-custom .gdate{width:170px}
.st-filters .gdate{width:170px}

/* ===== استجابة الهاتف ===== */
html,body.admin-page{max-width:100%;overflow-x:hidden}
#admin .card,#admin .field,#admin .grow,#admin .row2>*{min-width:0}
.ad-tabs .tab{flex:none}
.ad-top .brand-mini,.ad-top img,.ad-top .logo-mark{flex:none}

  .man-form{grid-template-columns:1fr 1fr}.man-form .man-note{grid-column:1/-1}

}

  .pay-off-row{grid-template-columns:44px 1fr}.pay-off-row>.in{grid-column:1/-1}
  .ad-top{flex-wrap:wrap;gap:8px 10px;padding:10px 12px;margin:8px;border-radius:18px}

  .card{padding:16px;border-radius:20px}.card h3{font-size:16.5px}

  .st-hero{padding:22px 18px;border-radius:22px}
  .st-filters{padding:12px}.st-filters .seg{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.st-filters .seg button{padding:9px 6px;font-size:13px}
  .st-filters .gsel,.st-filters .gdate,.st-custom .gdate,.st-filters select{width:100%!important;max-width:none!important}
  .st-custom{width:100%}.st-custom label{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:4px}

  .inv-bar .btn{flex:1 1 calc(50% - 6px);justify-content:center}
  .items-edit .it{grid-template-columns:minmax(0,1fr) 54px 80px 32px;gap:6px}
  .bn-adm-grid,.media-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .bars{gap:2px;height:150px}.bar i{font-size:9.5px}
  .man-form{grid-template-columns:1fr}
  .tbl-wrap{border-radius:12px}table.tbl{min-width:640px;font-size:13.5px}
  .code-row{flex-wrap:wrap}
}
@media(max-width:430px){

  .kpis{grid-template-columns:1fr}
  .seg button{padding:8px 10px}
  .inv-stage{border-radius:14px}
}
